[tool.poetry]
name = "model-trainer"
version = "0.3.0"
description = "Hydra + PyTorch Lightning training harness: clone, configure, train."
readme = "README.md"
license = "Apache-2.0"
authors = ["Nikolay Sviridov <nikswirlo@gmail.com>"]
keywords = ["hydra", "pytorch-lightning", "training", "deep-learning", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{ include = "model_trainer", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4"
torch = ">=2.0.0"
pytorch-lightning = ">=2.6.1,<3.0.0"
hydra-core = ">=1.3.0,<2.0.0"
omegaconf = ">=2.3.0"
transformers = ">=4.36.0"
datasets = ">=2.14.0"
torchmetrics = ">=1.0.0"
rich = ">=13.0.0"
# Optional extras:
wandb = { version = ">=0.16.0", optional = true }
scikit-learn = { version = ">=1.4.0", optional = true }
pandas = { version = ">=2.0.0", optional = true }

[tool.poetry.extras]
wandb = ["wandb"]
score = ["pandas", "scikit-learn"]
all = ["wandb", "pandas", "scikit-learn"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.5"
mypy = ">=1.10"
pre-commit = ">=3.7"
ipykernel = "^7.2.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]
ignore = [
    "E501",  # handled by the formatter
    "B008",  # function calls in defaults are normal in Hydra configs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
ignore_missing_imports = true
