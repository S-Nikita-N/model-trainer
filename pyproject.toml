[project]
name = "model-trainer"
version = "0.3.0"
description = "Hydra + PyTorch Lightning training harness: clone, configure, train."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Nikita Sviridov", email = "nikswirlo@gmail.com" }]
requires-python = ">=3.11,<4"
keywords = ["hydra", "pytorch-lightning", "training", "deep-learning", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0,<=2.10.0",
    "pytorch-lightning>=2.6.1,<3.0.0",
    "hydra-core>=1.3.0,<2.0.0",
    "omegaconf>=2.3.0",
    "transformers>=4.36.0",
    "datasets>=2.14.0",
    "torchmetrics>=1.0.0",
    "rich>=13.0.0",
    "wandb>=0.12.10",
]

[project.optional-dependencies]
score = ["pandas>=2.0.0", "scikit-learn>=1.4.0"]
all = ["pandas>=2.0.0", "scikit-learn>=1.4.0"]

[dependency-groups]
# Mirrors the `all` extra so a bare `uv sync` keeps pandas/scikit-learn.
extras = ["model-trainer[all]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=7.2.0",
    "nbconvert>=7.17.1",
]

[tool.uv]
default-groups = ["dev", "extras"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_trainer"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]
ignore = [
    "E501",  # handled by the formatter
    "B008",  # function calls in defaults are normal in Hydra configs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
ignore_missing_imports = true
