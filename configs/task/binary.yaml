# Single-logit binary classification with BCE. Element-wise; the
# ``BinaryClassificationTask`` squeezes trailing singleton automatically.
defaults:
  - /head@head: identity
  - /loss@loss: bce_with_logits
  - _self_

_target_: model_trainer.tasks.BinaryClassificationTask
_recursive_: false

label_key: labels
ignore_index: -100
metrics: {}
