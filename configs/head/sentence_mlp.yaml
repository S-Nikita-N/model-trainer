# Generic sentence-level head: mean-pool tokens of each sentence by
# (start, end) offsets, then a 2-layer MLP. Works for any role (context,
# response, raw single-text sentences)
_target_: model_trainer.heads.SentenceMLPHead
offsets_key: sentence_offsets
hidden_dim: 256
num_outputs: 1
dropout: 0.1
backbone_input_key: hidden_states
