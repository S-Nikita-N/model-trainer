# Per (response_i, context_j) head: pools both sides by sentence offsets,
# builds NLI-style pair features, MLP outputs ``num_outputs`` channels
# (default 2 → support / contradict evidence).
_target_: model_trainer.heads.PairwiseEvidenceHead
response_offsets_key: response_fact_offsets
context_offsets_key: context_fact_offsets
backbone_output_key: hidden_states
backbone_output_dim: null
hidden_dim: null
num_outputs: 2
dropout: 0.1
