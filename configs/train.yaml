# Root config for training. Override any group from the CLI, e.g.:
#   python -m model_trainer.train data=ragbench model=hf_encoder task=multitask
#
# Each top-level group is composable independently. The `task` config holds
# its own `head`, `loss`, and (initially empty) `metrics` dict — populate
# metrics via `+metrics@task.metrics.<name>=<stem>` on the CLI.
defaults:
  - _self_
  - paths: default
  - experiment: default
  - data: default
  - model: lstm
  - task: classification
  - optim: adamw
  - scheduler: cosine_warmup
  - trainer: default
  - strategy: auto
  - callbacks: default
  - logger: csv
  - profiler: null
  - hydra: default
